name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: Core and race tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Test with coverage floor
        run: |
          profile="$RUNNER_TEMP/core-coverage.out"
          go test -count=1 -covermode=atomic -coverpkg=./... -coverprofile="$profile" ./...
          ./scripts/check-coverage.sh "$profile" 72.0 "cross-package Go coverage"
      - run: go test -count=1 -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: node --check internal/server/dashboard/app.js
      - run: node --test scripts/verify-pnpm-audit.test.mjs
      - run: docker compose config -q
      - run: docker build --build-arg VERSION=ci -t fcp:ci .
      - name: Scan image for fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: fcp:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          severity: CRITICAL,HIGH
      - run: docker run --rm fcp:ci --version

  official-sdk:
    name: Official SDK compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.16.0
      - uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          gradle-version: 9.2.0
      - name: Start FCP with the demo profile
        run: |
          FCP_CI_DIR="$RUNNER_TEMP/fcp-ci"
          mkdir -p "$FCP_CI_DIR/coverage" "$FCP_CI_DIR/data"
          FCP_SDK_COVERPKG="./cmd/fcp,./internal/profile,./internal/runtime,./internal/server,./internal/state"
          go build -cover -covermode=atomic -coverpkg="$FCP_SDK_COVERPKG" -trimpath -o "$FCP_CI_DIR/fcp" ./cmd/fcp
          GOCOVERDIR="$FCP_CI_DIR/coverage" "$FCP_CI_DIR/fcp" \
            --listen 127.0.0.1:4566 \
            --gcp-listen 127.0.0.1:8085 \
            --integrity-mode strict \
            --data-dir "$FCP_CI_DIR/data" \
            --profile demo \
            --project fcp-local \
            --credentials-out "$FCP_CI_DIR/fcp-local-credentials.json" \
            >"$FCP_CI_DIR/fcp.log" 2>&1 &
          echo "$!" >"$FCP_CI_DIR/fcp.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4566/_fcp/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$FCP_CI_DIR/fcp.log"
          exit 1
      - name: Java and Kotlin SDK tests
        run: gradle -p test-clients/jvm test --no-daemon --rerun-tasks
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: ap-northeast-2
          AWS_ENDPOINT_URL: http://127.0.0.1:4566
          FCP_HTTP_ENDPOINT: http://127.0.0.1:4566
          FCP_GCP_ENDPOINT: 127.0.0.1:8085
          GOOGLE_GEMINI_BASE_URL: http://127.0.0.1:4566
          GOOGLE_API_KEY: fcp-local
      - name: JavaScript SDK tests
        working-directory: test-clients/javascript
        run: |
          pnpm install --frozen-lockfile
          audit_status=0
          pnpm audit --json >"$RUNNER_TEMP/pnpm-audit.json" || audit_status=$?
          if [ "$audit_status" -ne 0 ] && [ "$audit_status" -ne 1 ]; then
            exit "$audit_status"
          fi
          node ../../scripts/verify-pnpm-audit.mjs "$RUNNER_TEMP/pnpm-audit.json" audit-policy.json
          pnpm test
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: ap-northeast-2
          AWS_ENDPOINT_URL: http://127.0.0.1:4566
          FCP_HTTP_ENDPOINT: http://127.0.0.1:4566
          STORAGE_EMULATOR_HOST: http://127.0.0.1:4566
          PUBSUB_EMULATOR_HOST: 127.0.0.1:8085
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/fcp-ci/fcp-local-credentials.json
      - name: Stop FCP, verify SDK coverage and print logs on failure
        if: always()
        run: |
          FCP_CI_DIR="$RUNNER_TEMP/fcp-ci"
          cleanup_status=0
          if [ -f "$FCP_CI_DIR/fcp.pid" ]; then
            fcp_pid="$(cat "$FCP_CI_DIR/fcp.pid")"
            kill "$fcp_pid" 2>/dev/null || true
            for attempt in $(seq 1 50); do
              if ! kill -0 "$fcp_pid" 2>/dev/null; then
                break
              fi
              sleep 0.1
            done
            if kill -0 "$fcp_pid" 2>/dev/null; then
              echo "FCP did not stop after SIGTERM" >&2
              kill -KILL "$fcp_pid" 2>/dev/null || true
              cleanup_status=1
            fi
          fi
          if [ -d "$FCP_CI_DIR/coverage" ] && [ -n "$(find "$FCP_CI_DIR/coverage" -type f -print -quit)" ]; then
            go tool covdata textfmt -i="$FCP_CI_DIR/coverage" -o="$FCP_CI_DIR/sdk-coverage.out"
            ./scripts/check-coverage.sh "$FCP_CI_DIR/sdk-coverage.out" 40.0 "official SDK server-package coverage" || cleanup_status=$?
          else
            echo "official SDK server coverage data is missing" >&2
            cleanup_status=1
          fi
          if [ "${{ job.status }}" != "success" ] && [ -f "$FCP_CI_DIR/fcp.log" ]; then
            cat "$FCP_CI_DIR/fcp.log"
          fi
          exit "$cleanup_status"
