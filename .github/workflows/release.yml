name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version used for a non-publishing release dry-run
        required: true
        default: v0.0.0-dry-run
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  verify:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate semantic version tag
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "unsupported release version: $RELEASE_VERSION" >&2
            exit 1
          fi

  quality:
    name: Verify release quality gates
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  binaries:
    name: Publish signed release assets
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archives
        run: ./scripts/build-release.sh "$RELEASE_VERSION" dist
      - name: Upload dry-run evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ env.RELEASE_VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Attest release assets
        if: github.event_name == 'push'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
      - name: Verify release asset attestations
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/*.tar.gz dist/checksums.txt; do
            gh attestation verify "$artifact" -R "$GITHUB_REPOSITORY"
          done
      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_VERSION" dist/* --verify-tag --generate-notes --title "FCP $RELEASE_VERSION"

  image:
    name: Publish multi-architecture image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_VERSION }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_VERSION }},enable=${{ !startsWith(env.RELEASE_VERSION, 'v0.') }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(env.RELEASE_VERSION, '-') }}
            type=raw,value=dry-run,enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.RELEASE_VERSION }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest image
        if: github.event_name == 'push'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Verify image attestation
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "oci://ghcr.io/$GITHUB_REPOSITORY@${{ steps.push.outputs.digest }}" -R "$GITHUB_REPOSITORY"
